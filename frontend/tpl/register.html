<div class="container py-4">
  <h2 class="mb-3">Registracija</h2>

  <div class="card p-3">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        id="regEmail"
        type="email"
        class="form-control"
        placeholder="new@test.com"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        id="regPassword"
        type="password"
        class="form-control"
        placeholder="••••••"
      />
    </div>

    <button class="btn btn-success" id="btnRegister">Register</button>

    <div class="mt-3">Već imaš račun? <a href="#login">Prijavi se</a></div>

    <div class="mt-2 text-danger" id="regError"></div>
    <div class="mt-2 text-success" id="regOk"></div>
  </div>
</div>
